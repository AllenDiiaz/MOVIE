<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 390" width="860" height="390" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
    <marker id="arr-up" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000022"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="390" fill="#FAFAF9" rx="12"/>

  <!-- Title -->
  <text x="430" y="32" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F2937" letter-spacing="0.5">MOVIE: Modeling ODEs with Visually Interpretable Evolution</text>
  <line x1="60" y1="42" x2="800" y2="42" stroke="#D1D5DB" stroke-width="0.8"/>

  <!-- ── MAIN FLOW (top row) ── -->

  <!-- Early Frame box -->
  <rect x="30" y="120" width="108" height="90" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="84" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400E">Early Frame</text>
  <text x="84" y="163" text-anchor="middle" font-size="10" fill="#92400E">Frame 13</text>
  <text x="84" y="177" text-anchor="middle" font-size="9.5" fill="#78350F">(9.5–10.5 min p.i.)</text>
  <rect x="46" y="186" width="76" height="16" rx="3" fill="#FDE68A" stroke="#D97706" stroke-width="0.8"/>
  <text x="84" y="197.5" text-anchor="middle" font-size="9" fill="#92400E">rCBF proxy</text>

  <!-- Arrow: early → φ -->
  <line x1="138" y1="165" x2="182" y2="165" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Encoder φ -->
  <rect x="184" y="130" width="80" height="70" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="224" y="155" text-anchor="middle" font-size="13" font-style="italic" fill="#065F46">φ</text>
  <text x="224" y="172" text-anchor="middle" font-size="9.5" fill="#065F46">Source</text>
  <text x="224" y="185" text-anchor="middle" font-size="9.5" fill="#065F46">Encoder</text>

  <!-- Arrow: φ → ODE/SDE -->
  <line x1="264" y1="165" x2="300" y2="165" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="282" y="158" text-anchor="middle" font-size="9" fill="#6B7280" font-style="italic">z₀</text>

  <!-- Latent ODE/SDE block -->
  <rect x="302" y="98" width="168" height="134" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="386" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#4C1D95">Latent Evolution</text>
  <line x1="318" y1="130" x2="454" y2="130" stroke="#7C3AED" stroke-width="0.6" stroke-dasharray="3,2"/>

  <!-- ODE label -->
  <rect x="316" y="136" width="72" height="42" rx="4" fill="#DDD6FE" stroke="#7C3AED" stroke-width="1"/>
  <text x="352" y="153" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#4C1D95">Neural ODE</text>
  <text x="352" y="168" text-anchor="middle" font-size="8.5" font-style="italic" fill="#5B21B6">dz/dt = f_θ(z,t)</text>

  <!-- SDE label -->
  <rect x="398" y="136" width="72" height="42" rx="4" fill="#C4B5FD" stroke="#7C3AED" stroke-width="1"/>
  <text x="434" y="153" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#4C1D95">Neural SDE</text>
  <text x="434" y="168" text-anchor="middle" font-size="8.5" font-style="italic" fill="#5B21B6">dz = f dt + g dW</text>

  <!-- FiLM tag inside latent block -->
  <rect x="330" y="186" width="112" height="34" rx="4" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="386" y="200" text-anchor="middle" font-size="9" fill="#6D28D9">FiLM modulation</text>
  <text x="386" y="213" text-anchor="middle" font-size="8.5" font-style="italic" fill="#7C3AED">γ(F_mid)⊙f_θ + β(F_mid)</text>

  <!-- Arrow: ODE/SDE → ϑ -->
  <line x1="470" y1="165" x2="508" y2="165" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="489" y="158" text-anchor="middle" font-size="9" fill="#6B7280" font-style="italic">z_T</text>

  <!-- Decoder ϑ -->
  <rect x="510" y="130" width="80" height="70" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="550" y="155" text-anchor="middle" font-size="13" font-style="italic" fill="#065F46">ϑ</text>
  <text x="550" y="172" text-anchor="middle" font-size="9.5" fill="#065F46">Decoder</text>
  <text x="550" y="185" text-anchor="middle" font-size="9" fill="#065F46">+ Sigmoid</text>

  <!-- Arrow: ϑ → Late Frame -->
  <line x1="590" y1="165" x2="628" y2="165" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Late Frame box -->
  <rect x="630" y="120" width="108" height="90" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="684" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#991B1B">Late Frame</text>
  <text x="684" y="163" text-anchor="middle" font-size="10" fill="#991B1B">Frame 24</text>
  <text x="684" y="177" text-anchor="middle" font-size="9.5" fill="#7F1D1D">(60.5–70.5 min p.i.)</text>
  <rect x="646" y="186" width="76" height="16" rx="3" fill="#FECACA" stroke="#DC2626" stroke-width="0.8"/>
  <text x="684" y="197.5" text-anchor="middle" font-size="9" fill="#991B1B">Amyloid binding</text>

  <!-- ── GUIDE FLOW (bottom row) ── -->

  <!-- Mid Frames box -->
  <rect x="30" y="272" width="138" height="78" rx="6" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="99" y="295" text-anchor="middle" font-size="11" font-weight="bold" fill="#0C4A6E">Mid Frames</text>
  <text x="99" y="310" text-anchor="middle" font-size="9.5" fill="#075985">Frames 17, 19, 21</text>
  <text x="99" y="323" text-anchor="middle" font-size="9" fill="#0369A1">(17.5–40.5 min p.i.)</text>
  <text x="99" y="338" text-anchor="middle" font-size="8.5" fill="#075985">Uniform temporal sampling</text>

  <!-- Arrow: Mid Frames → φ' -->
  <line x1="168" y1="311" x2="208" y2="311" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arr-up)"/>

  <!-- Encoder φ' -->
  <rect x="210" y="281" width="80" height="60" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="250" y="306" text-anchor="middle" font-size="13" font-style="italic" fill="#14532D">φ'</text>
  <text x="250" y="322" text-anchor="middle" font-size="9.5" fill="#14532D">Guide</text>
  <text x="250" y="335" text-anchor="middle" font-size="9.5" fill="#14532D">Encoder</text>

  <!-- Arrow: φ' → FiLM -->
  <line x1="290" y1="311" x2="330" y2="311" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arr-up)"/>

  <!-- FiLM Generator box -->
  <rect x="332" y="277" width="118" height="68" rx="6" fill="#FDF4FF" stroke="#A855F7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="391" y="299" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#581C87">FiLM Generator</text>
  <text x="391" y="315" text-anchor="middle" font-size="9" font-style="italic" fill="#7E22CE">γ = tanh(W_γ · F_mid)</text>
  <text x="391" y="329" text-anchor="middle" font-size="9" font-style="italic" fill="#7E22CE">β = 0.1·tanh(W_β · F_mid)</text>
  <text x="391" y="340" text-anchor="middle" font-size="8.5" fill="#9333EA">bounded: γ∈(-1,1), β∈(-0.1,0.1)</text>

  <!-- Arrow: FiLM → Latent block (going up) -->
  <line x1="391" y1="277" x2="391" y2="235" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-up)"/>

  <!-- Guide Dropout annotation -->
  <rect x="758" y="268" width="82" height="60" rx="5" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="799" y="287" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#92400E">Guide Dropout</text>
  <text x="799" y="300" text-anchor="middle" font-size="9" fill="#78350F">p_full: 0→100%</text>
  <text x="799" y="313" text-anchor="middle" font-size="9" fill="#78350F">over 40 epochs</text>
  <text x="799" y="326" text-anchor="middle" font-size="8.5" fill="#92400E">→ inference w/o guide</text>

  <!-- Dashed line to FiLM from Guide Dropout -->
  <line x1="758" y1="298" x2="460" y2="298" stroke="#F59E0B" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Step-by-step visualization annotation -->
  <rect x="758" y="120" width="82" height="60" rx="5" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.2"/>
  <text x="799" y="139" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#14532D">Interpretability</text>
  <text x="799" y="153" text-anchor="middle" font-size="9" fill="#166534">Decode y⁽ᵏ⁾ at</text>
  <text x="799" y="166" text-anchor="middle" font-size="9" fill="#166534">each step k∈{0..8}</text>
  <text x="799" y="179" text-anchor="middle" font-size="8.5" fill="#15803D">Δ⁽ᵏ⁾= y⁽ᵏ⁾−y⁽⁰⁾</text>

  <line x1="758" y1="150" x2="472" y2="150" stroke="#22C55E" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Loss function note at bottom -->
  <rect x="30" y="365" width="740" height="18" rx="4" fill="#F3F4F6"/>
  <text x="400" y="377.5" text-anchor="middle" font-size="9" fill="#4B5563">
    <tspan font-weight="bold">Loss: </tspan>
    <tspan font-style="italic">L_total = L_syn(MSE + DSSIM + LPIPS) + λ_sm · L_drift + λ_cons · L_cons</tspan>
    <tspan>  |  Optimiser: AdamW  |  5-fold stratified cross-validation</tspan>
  </text>

  <!-- Legend -->
  <rect x="30" y="56" width="8" height="8" rx="2" fill="#D97706"/>
  <text x="44" y="64" font-size="9" fill="#4B5563">PET Frames</text>
  <rect x="110" y="56" width="8" height="8" rx="2" fill="#059669"/>
  <text x="124" y="64" font-size="9" fill="#4B5563">Encoder / Decoder</text>
  <rect x="230" y="56" width="8" height="8" rx="2" fill="#7C3AED"/>
  <text x="244" y="64" font-size="9" fill="#4B5563">Latent ODE/SDE</text>
  <rect x="340" y="56" width="8" height="8" rx="2" fill="#A855F7"/>
  <text x="354" y="64" font-size="9" fill="#4B5563">FiLM Modulation</text>
  <rect x="450" y="56" width="8" height="8" rx="2" fill="#F59E0B"/>
  <text x="464" y="64" font-size="9" fill="#4B5563">Guide Dropout (curriculum)</text>
</svg>
