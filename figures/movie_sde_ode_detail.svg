<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
    <filter id="sh2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000020"/>
    </filter>
  </defs>

  <rect width="860" height="440" fill="#FAFAF9" rx="12"/>

  <!-- Title -->
  <text x="430" y="32" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F2937" letter-spacing="0.5">MOVIE: Latent Dynamics — Neural ODE vs. SDE with FiLM Conditioning</text>
  <line x1="60" y1="42" x2="800" y2="42" stroke="#D1D5DB" stroke-width="0.8"/>

  <!-- ── SHARED: Input z₀ ── -->
  <rect x="340" y="58" width="180" height="52" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.5" filter="url(#sh2)"/>
  <text x="430" y="78" text-anchor="middle" font-size="11" font-weight="bold" fill="#065F46">Initial Latent State z₀</text>
  <text x="430" y="96" text-anchor="middle" font-size="9.5" font-style="italic" fill="#047857">z₀ = φ(Early Frame)   ∈ ℝ^(C×H×W)</text>

  <!-- Fork arrows -->
  <line x1="380" y1="110" x2="230" y2="148" stroke="#374151" stroke-width="1.3" marker-end="url(#arr2)"/>
  <line x1="480" y1="110" x2="630" y2="148" stroke="#374151" stroke-width="1.3" marker-end="url(#arr2)"/>

  <!-- ══════════ LEFT: Neural ODE ══════════ -->
  <rect x="30" y="150" width="370" height="210" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#sh2)"/>
  <rect x="30" y="150" width="370" height="32" rx="8" fill="#4F46E5"/>
  <text x="215" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Neural ODE  (Deterministic)</text>

  <!-- ODE equation -->
  <rect x="50" y="194" width="330" height="50" rx="5" fill="white" stroke="#818CF8" stroke-width="1"/>
  <text x="215" y="212" text-anchor="middle" font-size="10" fill="#3730A3">Continuous-time drift:</text>
  <text x="215" y="232" text-anchor="middle" font-size="13" font-style="italic" fill="#1E1B4B">dz(t)/dt  =  f_θdrift ( z(t), t )</text>

  <!-- ODE solution -->
  <rect x="50" y="254" width="330" height="46" rx="5" fill="#E0E7FF" stroke="#818CF8" stroke-width="1"/>
  <text x="215" y="271" text-anchor="middle" font-size="10" fill="#3730A3">Numerical solution (Euler, 8 steps):</text>
  <text x="215" y="289" text-anchor="middle" font-size="12" font-style="italic" fill="#1E1B4B">z_T = ODESolve( f_θ, z₀, [0,1] )</text>

  <!-- ODE properties -->
  <text x="50" y="318" font-size="9.5" fill="#4338CA">✦  Deterministic trajectory</text>
  <text x="50" y="333" font-size="9.5" fill="#4338CA">✦  Smooth latent path</text>
  <text x="50" y="348" font-size="9.5" fill="#4338CA">✦  Lower stochasticity → faster convergence</text>

  <!-- ══════════ RIGHT: Neural SDE ══════════ -->
  <rect x="460" y="150" width="370" height="210" rx="8" fill="#FDF4FF" stroke="#9333EA" stroke-width="2" filter="url(#sh2)"/>
  <rect x="460" y="150" width="370" height="32" rx="8" fill="#9333EA"/>
  <text x="645" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Neural SDE  (Stochastic)</text>

  <!-- SDE equation -->
  <rect x="480" y="194" width="330" height="50" rx="5" fill="white" stroke="#C084FC" stroke-width="1"/>
  <text x="645" y="212" text-anchor="middle" font-size="10" fill="#581C87">Drift + diffusion (Itô form):</text>
  <text x="645" y="232" text-anchor="middle" font-size="12" font-style="italic" fill="#3B0764">dz = f_θ(z,t)dt  +  g_θ(z,t) dW(t)</text>

  <!-- SDE components -->
  <rect x="480" y="254" width="330" height="46" rx="5" fill="#FAE8FF" stroke="#C084FC" stroke-width="1"/>
  <text x="645" y="271" text-anchor="middle" font-size="10" fill="#581C87">Wiener process W(t): Brownian motion</text>
  <text x="645" y="289" text-anchor="middle" font-size="10" fill="#6B21A8">g_θ: diagonal noise  |  noise_type = "diagonal"</text>

  <!-- SDE properties -->
  <text x="480" y="318" font-size="9.5" fill="#7E22CE">✦  Stochastic trajectory captures variability</text>
  <text x="480" y="333" font-size="9.5" fill="#7E22CE">✦  Biologically plausible variance modeling</text>
  <text x="480" y="348" font-size="9.5" fill="#7E22CE">✦  Better PSNR/SSIM — superior synthesis quality</text>

  <!-- ══════════ SHARED: FiLM Modulation ══════════ -->
  <rect x="120" y="380" width="620" height="48" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8" filter="url(#sh2)"/>
  <text x="215" y="398" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400E">Shared: FiLM Conditioning  (mid-frame guidance)</text>
  <text x="645" y="398" text-anchor="middle" font-size="10" font-style="italic" fill="#78350F">f_mod = clamp( γ(F_mid) ⊙ f_θ + β(F_mid),  −3, 3 )</text>
  <text x="430" y="418" text-anchor="middle" font-size="9" fill="#92400E">γ = tanh(W_γ·F_mid) ∈ (−1,1)   |   β = 0.1·tanh(W_β·F_mid) ∈ (−0.1, 0.1)   |   Spatial H×W preserved</text>

  <!-- Arrows to FiLM -->
  <line x1="215" y1="360" x2="300" y2="378" stroke="#D97706" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arr2)"/>
  <line x1="645" y1="360" x2="560" y2="378" stroke="#D97706" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arr2)"/>

  <!-- Output annotation -->
  <rect x="340" y="58" width="0" height="0"/>

  <!-- Shared decoder note -->
  <rect x="340" y="430" width="180" height="0" rx="4"/>

  <!-- Stability note for drift -->
  <rect x="50" y="194" width="0" height="0"/>

  <!-- Clamp note ODE side -->
  <rect x="60" y="352" width="140" height="14" rx="3" fill="#EEF2FF"/>
  <text x="130" y="362.5" text-anchor="middle" font-size="8.5" fill="#4338CA">Drift clamped to [−3, 3] for stability</text>

  <!-- Clamp note SDE side -->
  <rect x="490" y="352" width="140" height="14" rx="3" fill="#FDF4FF"/>
  <text x="560" y="362.5" text-anchor="middle" font-size="8.5" fill="#7E22CE">Drift clamped to [−3, 3] for stability</text>

  <!-- Output arrows from both -->
  <line x1="215" y1="360" x2="215" y2="376" stroke="#374151" stroke-width="1.2" marker-end="url(#arr2)"/>
  <line x1="645" y1="360" x2="645" y2="376" stroke="#374151" stroke-width="1.2" marker-end="url(#arr2)"/>

  <!-- vs divider -->
  <line x1="430" y1="155" x2="430" y2="358" stroke="#E5E7EB" stroke-width="1.5" stroke-dasharray="6,3"/>
  <rect x="415" y="248" width="30" height="22" rx="4" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/>
  <text x="430" y="263" text-anchor="middle" font-size="10" font-weight="bold" fill="#6B7280">vs</text>
</svg>
